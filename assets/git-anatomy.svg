<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650">
<rect width="1600" height="650" rx="30" fill="#0a0f1c"/>
<text x="75" y="78" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Git 时间戳为什么能被指定？</text>
<text x="75" y="118" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#94a3b8">A timestamp is data inside the commit object.</text>
<g transform="translate(75 170)">
<rect width="690" height="390" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
<text x="35" y="55" font-family="Menlo,Consolas,monospace" font-size="20" fill="#67e8f9">commit object</text>
<text x="35" y="105" font-family="Menlo,Consolas,monospace" font-size="19" fill="#cbd5e1">tree      d01cbc31...</text>
<text x="35" y="145" font-family="Menlo,Consolas,monospace" font-size="19" fill="#cbd5e1">parent    47f1ab90...</text>
<text x="35" y="205" font-family="Menlo,Consolas,monospace" font-size="19" fill="#fcd34d">author    Demo &lt;demo@example.com&gt;</text>
<rect x="28" y="226" width="620" height="46" rx="10" fill="#7c2d12" opacity=".6"/>
<text x="44" y="257" font-family="Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#fed7aa">1971-11-15 12:00:00 +0000</text>
<text x="35" y="315" font-family="Menlo,Consolas,monospace" font-size="19" fill="#fcd34d">committer Demo &lt;demo@example.com&gt;</text>
<text x="35" y="358" font-family="Menlo,Consolas,monospace" font-size="18" fill="#cbd5e1">milestone: Intel 4004...</text>
</g>
<g transform="translate(850 210)" font-family="Arial,Helvetica,sans-serif">
<circle cx="130" cy="60" r="50" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/>
<text x="130" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#bae6fd">DATE</text>
<path d="M185 60H340" stroke="#38bdf8" stroke-width="4"/>
<path d="M320 44L345 60L320 76" fill="none" stroke="#38bdf8" stroke-width="4"/>
<rect x="350" y="18" width="250" height="84" rx="18" fill="#10243d" stroke="#60a5fa"/>
<text x="475" y="52" text-anchor="middle" font-size="19" fill="#e2e8f0">commit object</text>
<text x="475" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#93c5fd">new SHA</text>
<text x="0" y="170" font-size="23" font-weight="700" fill="#f8fafc">修改时间，就是修改 commit 内容。</text>
<text x="0" y="210" font-size="20" fill="#94a3b8">Change timestamp → change object → change SHA.</text>
<text x="0" y="270" font-size="21" fill="#cbd5e1">这不是漏洞，是 Git 的正常数据模型。</text>
<text x="0" y="305" font-size="19" fill="#94a3b8">Migrations, imports and history rewriting rely on it.</text>
</g>
</svg>