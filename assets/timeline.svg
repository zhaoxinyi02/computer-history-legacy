<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<rect width="1600" height="720" rx="30" fill="#0b1220"/>
<text x="80" y="80" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#f8fafc">1945 starts the story · 1970 starts the Git log</text>
<text x="80" y="120" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#94a3b8">计算机史序章 + 可表示的 Git 时间线</text>
<line x1="130" y1="350" x2="1470" y2="350" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
<line x1="500" y1="350" x2="1470" y2="350" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(180 0)"><circle cy="350" r="15" fill="#64748b"/><text y="300" text-anchor="middle" font-size="24" fill="#e2e8f0">1945</text><text y="400" text-anchor="middle" font-size="19" fill="#94a3b8">ENIAC</text></g>
<g transform="translate(500 0)"><circle cy="350" r="18" fill="#38bdf8"/><text y="290" text-anchor="middle" font-size="26" font-weight="700" fill="#bae6fd">1970</text><text y="405" text-anchor="middle" font-size="19" fill="#7dd3fc">Unix epoch</text></g>
<g transform="translate(650 0)"><circle cy="350" r="13" fill="#60a5fa"/><text y="300" text-anchor="middle" font-size="22" fill="#e2e8f0">1971</text><text y="400" text-anchor="middle" font-size="18" fill="#94a3b8">Intel 4004</text></g>
<g transform="translate(820 0)"><circle cy="350" r="13" fill="#818cf8"/><text y="300" text-anchor="middle" font-size="22" fill="#e2e8f0">1981</text><text y="400" text-anchor="middle" font-size="18" fill="#94a3b8">IBM PC</text></g>
<g transform="translate(980 0)"><circle cy="350" r="13" fill="#818cf8"/><text y="300" text-anchor="middle" font-size="22" fill="#e2e8f0">1991</text><text y="400" text-anchor="middle" font-size="18" fill="#94a3b8">Web</text></g>
<g transform="translate(1130 0)"><circle cy="350" r="13" fill="#2dd4bf"/><text y="300" text-anchor="middle" font-size="22" fill="#e2e8f0">2005</text><text y="400" text-anchor="middle" font-size="18" fill="#94a3b8">Git</text></g>
<g transform="translate(1240 0)"><circle cy="350" r="13" fill="#2dd4bf"/><text y="300" text-anchor="middle" font-size="22" fill="#e2e8f0">2007</text><text y="400" text-anchor="middle" font-size="18" fill="#94a3b8">Smartphone</text></g>
<g transform="translate(1370 0)"><circle cy="350" r="15" fill="#34d399"/><text y="300" text-anchor="middle" font-size="22" fill="#d1fae5">2022</text><text y="400" text-anchor="middle" font-size="18" fill="#a7f3d0">Gen AI</text></g>
<g transform="translate(1470 0)"><circle cy="350" r="16" fill="#10b981"/><text y="280" text-anchor="middle" font-size="23" fill="#d1fae5">2026</text><text y="425" text-anchor="middle" font-size="18" fill="#a7f3d0">AI-native</text></g>
</g>
<rect x="80" y="510" width="1440" height="125" rx="22" fill="#111827" stroke="#334155"/>
<text x="120" y="560" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Why the gap?</text>
<text x="280" y="560" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#cbd5e1">Git's normal timestamp toolchain is bounded by the Unix epoch.</text>
<text x="120" y="600" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#94a3b8">1945–1969 is historical prologue. The synthetic commit chain begins honestly at 1970.</text>
</svg>